[project]
name = "agent-gateway"
description = "Add ChatGPT/Codex and GitHub Copilot models to Claude Code while preserving native Claude login."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Julien Fresnel" }]
keywords = ["claude-code", "litellm", "gateway", "codex", "github-copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # Pinned, reviewed LiteLLM. Versions 1.82.7 and 1.82.8 are FORBIDDEN
    # (identified as compromised by Anthropic's gateway documentation).
    "litellm[proxy]==1.93.0",
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<0.29",
    "starlette>=1.0.1,<2.0",
    "uvicorn>=0.30,<1.0",
    "filelock>=3.13,<4.0",
    "psutil>=5.9,<8.0",
]

[project.urls]
Homepage = "https://github.com/JuLius5838/agw"
Repository = "https://github.com/JuLius5838/agw"
Issues = "https://github.com/JuLius5838/agw/issues"
Changelog = "https://github.com/JuLius5838/agw/blob/main/CHANGELOG.md"

[project.scripts]
agw = "agent_gateway.cli:app"
agw-litellm = "agent_gateway.litellm_runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.0,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_gateway/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

# Test bodies are still type-checked, but we don't force a return/param annotation
# on every test function (pytest fixtures like `tmp_path` are implicitly typed).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Also collect the manual live-smoke module (not named test_*.py by design).
python_files = ["test_*.py", "live_smoke.py"]
addopts = "-ra -m 'not live'"
markers = [
    "live: tests requiring real provider OAuth credentials (skipped by default; run with -m live)",
    "contract: process and protocol contracts; provider-bridge contracts are also marked live",
]
